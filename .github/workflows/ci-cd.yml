name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master

        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 1
