version: "3.9"

services:

  flask-app:
    image: didiemerhor1/flask-app:latest
    container_name: flask-app

    ports:
      - "5000:5000"

    env_file:
      - .env

    restart: always

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16

    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: appdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: redis-cache

    restart: always

    ports:
      - "6379:6379"

volumes:
  postgres_data:

  nginx:
    image: nginx:latest
    container_name: nginx-proxy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - flask-app
